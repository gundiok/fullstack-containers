services:
  
  app:
    image: quiz-front-dev
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    volumes: 
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    container_name: quiz-front-dev

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: quiz-reverse-proxy
    depends_on:
      - app

  server:
    image: quiz-back-dev
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    container_name: quiz-back-dev
    env_file:
    - ./backend/.env
      